<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow expressions</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e2e8f0;max-width:900px;margin:30px auto;padding:0 16px}h1{font-size:22px}h2{font-size:16px;margin-top:28px}textarea{width:100%;height:150px;font:13px Consolas,monospace;background:#1e293b;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:10px;box-sizing:border-box}button{margin-top:8px;padding:8px 16px;font-size:14px;border:0;border-radius:6px;background:#facc15;color:#111;cursor:pointer;font-weight:600}.ok{margin-left:10px;color:#86efac}p{color:#94a3b8;font-size:14px}</style></head><body>
<h1>Mishap Dashboard flow: expressions</h1>
<p>Click Copy, then paste into the fx (Expression) box in Power Automate.</p>
<h2>Step 5: Compose, Inputs</h2>
<textarea id="e1" readonly>replace(replace(base64ToString(body('Get_file_content')?['$content']), '__PA_REFRESHED__', convertFromUtc(utcNow(), 'Central Standard Time', 'dd-MMM-yy HHmm')), '__PA_DATA__', replace(string(createArray(addProperty(addProperty(json('{}'), 'file', 'Tracker.xlsx'), 'rows', body('List_rows_present_in_a_table')?['value']), addProperty(addProperty(json('{}'), 'file', 'Rollup.xlsx'), 'rows', body('List_rows_present_in_a_table_1')?['value']))), '&lt;/', '&lt;\/'))</textarea>
<button onclick="cp('e1',this)">Copy</button><span class="ok"></span>
<h2>Step 6: Update file, File Content</h2>
<textarea id="e2" readonly style="height:50px">outputs('Compose')</textarea>
<button onclick="cp('e2',this)">Copy</button><span class="ok"></span>
<h2>Only if Compose gives a base64 error: alternate Compose expression</h2>
<textarea id="e3" readonly>replace(replace(string(body('Get_file_content')), '__PA_REFRESHED__', convertFromUtc(utcNow(), 'Central Standard Time', 'dd-MMM-yy HHmm')), '__PA_DATA__', replace(string(createArray(addProperty(addProperty(json('{}'), 'file', 'Tracker.xlsx'), 'rows', body('List_rows_present_in_a_table')?['value']), addProperty(addProperty(json('{}'), 'file', 'Rollup.xlsx'), 'rows', body('List_rows_present_in_a_table_1')?['value']))), '&lt;/', '&lt;\/'))</textarea>
<button onclick="cp('e3',this)">Copy</button><span class="ok"></span>
<script>function cp(id,b){var t=document.getElementById(id);t.select();var done=function(){b.nextElementSibling.textContent='Copied';};if(navigator.clipboard){navigator.clipboard.writeText(t.value).then(done,function(){document.execCommand('copy');done();});}else{document.execCommand('copy');done();}}</script>
</body></html>
