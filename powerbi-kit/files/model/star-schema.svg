<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <rect width="1100" height="640" fill="#0A1424"/>
  <text x="550" y="32" fill="#E7EDF5" font-size="18" font-weight="700" text-anchor="middle">Recommended star schema (fictional data model)</text>
  <text x="550" y="52" fill="#9FB0C6" font-size="12" text-anchor="middle">Facts (olive) relate many-to-one to shared dimensions (blue). Single-direction filters.</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6F829C"/></marker></defs>
  <g stroke="#6F829C" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <!-- to Date (center) -->
    <path d="M250,150 L470,290"/><path d="M250,330 L470,315"/><path d="M250,505 L470,340"/>
    <path d="M850,150 L630,290"/><path d="M850,430 L630,330"/>
    <!-- to DimUnit -->
    <path d="M150,195 L150,250 M150,250 L150,250"/><path d="M110,195 C40,300 40,420 110,470"/>
    <path d="M150,370 L150,465"/>
    <!-- to DimProgram / DimOrganization -->
    <path d="M940,195 L940,250"/><path d="M990,195 C1070,300 1070,330 990,330"/>
    <path d="M940,470 L940,375"/><path d="M990,470 C1070,430 1070,300 990,290"/>
  </g>
  <g>
    <rect x="40" y="80" width="220" height="115" rx="8" fill="#2E3A1C" stroke="#A9B97A"/>
    <text x="52" y="102" fill="#E7EDF5" font-weight="700">FactReadiness</text>
    <text x="52" y="122" fill="#C7D3E3">unit_id, MonthStart</text><text x="52" y="139" fill="#C7D3E3">authorized, assigned, mosq_pct</text><text x="52" y="156" fill="#C7D3E3">mrc1-4, equip_*_pct, *_training_pct</text><text x="52" y="173" fill="#C7D3E3">readiness_rating</text>

    <rect x="40" y="255" width="220" height="115" rx="8" fill="#16294A" stroke="#5AA6E6"/>
    <text x="52" y="277" fill="#E7EDF5" font-weight="700">DimUnit</text>
    <text x="52" y="297" fill="#C7D3E3">unit_id (key), unit_name</text><text x="52" y="314" fill="#C7D3E3">battalion, brigade, branch</text><text x="52" y="331" fill="#C7D3E3">location, armory, lat, lon</text><text x="52" y="348" fill="#C7D3E3">authorized</text>

    <rect x="40" y="470" width="220" height="70" rx="8" fill="#2E3A1C" stroke="#A9B97A"/>
    <text x="52" y="492" fill="#E7EDF5" font-weight="700">FactMishap</text>
    <text x="52" y="512" fill="#C7D3E3">unit_id, date, class, category</text><text x="52" y="529" fill="#C7D3E3">duty_status, days_lost, cost</text>

    <rect x="40" y="560" width="220" height="60" rx="8" fill="#2E3A1C" stroke="#A9B97A"/>
    <text x="52" y="582" fill="#E7EDF5" font-weight="700">FactStrength / FactMedical</text>
    <text x="52" y="602" fill="#C7D3E3">unit_id, MonthStart, assigned / MRC</text>

    <rect x="470" y="260" width="160" height="110" rx="8" fill="#16294A" stroke="#5AA6E6" stroke-width="2"/>
    <text x="482" y="282" fill="#E7EDF5" font-weight="700">Date (marked)</text>
    <text x="482" y="302" fill="#C7D3E3">Date (key, daily)</text><text x="482" y="319" fill="#C7D3E3">MonthStart, Month</text><text x="482" y="336" fill="#C7D3E3">Fiscal Year / Quarter</text><text x="482" y="353" fill="#C7D3E3">YearMonth (sort)</text>

    <rect x="840" y="80" width="220" height="115" rx="8" fill="#2E3A1C" stroke="#A9B97A"/>
    <text x="852" y="102" fill="#E7EDF5" font-weight="700">FactFunds</text>
    <text x="852" y="122" fill="#C7D3E3">program_code, organization</text><text x="852" y="139" fill="#C7D3E3">MonthStart, fy</text><text x="852" y="156" fill="#C7D3E3">afp, allotment, plan, commitments</text><text x="852" y="173" fill="#C7D3E3">obligations, disbursements, tdy</text>

    <rect x="840" y="255" width="220" height="80" rx="8" fill="#16294A" stroke="#5AA6E6"/>
    <text x="852" y="277" fill="#E7EDF5" font-weight="700">DimProgram</text>
    <text x="852" y="297" fill="#C7D3E3">program_code (key), program_name</text><text x="852" y="314" fill="#C7D3E3">appropriation, Funds Life</text>

    <rect x="840" y="345" width="220" height="70" rx="8" fill="#16294A" stroke="#5AA6E6"/>
    <text x="852" y="367" fill="#E7EDF5" font-weight="700">DimOrganization</text>
    <text x="852" y="387" fill="#C7D3E3">organization (key), brigade</text>

    <rect x="840" y="430" width="220" height="80" rx="8" fill="#2E3A1C" stroke="#A9B97A"/>
    <text x="852" y="452" fill="#E7EDF5" font-weight="700">FactUFR</text>
    <text x="852" y="472" fill="#C7D3E3">ufr_id, program_code, organization</text><text x="852" y="489" fill="#C7D3E3">amount, priority, status, fy</text>

    <rect x="470" y="470" width="160" height="60" rx="8" fill="#2E3A1C" stroke="#A9B97A"/>
    <text x="482" y="492" fill="#E7EDF5" font-weight="700">FactEvents</text>
    <text x="482" y="512" fill="#C7D3E3">start, end, battalion</text>
  </g>
  <text x="550" y="625" fill="#6F829C" font-size="11" text-anchor="middle">Data shown is fictional for demonstration.</text>
</svg>
